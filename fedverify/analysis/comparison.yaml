  - name: "NbAFL"
    cite: "Wei et al., IEEE TIFS 2020"
    dp: "yes"         # noising before aggregation, with a convergence bound
    byzantine: "no"
    commit: "no"      # no blockchain component at all
    proofs: "no"
    l1: "no"
    forensics: "no"
