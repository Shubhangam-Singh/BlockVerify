  - name: "FedVerify (this work)"
    cite: "—"
    dp: "yes"         # Opacus RDP accountant, sigma solved over TOTAL steps (Phase 2)
    byzantine: "yes"  # FedVerify-Forensics + Krum/Multi-Krum/median/trimmed-mean (Phase 4)
    commit: "yes"     # per-round Merkle root over per-client update digests (Phase 3)
    proofs: "yes"     # GET /api/fl/proof/... folds to the anchored root (Phase 3)
    l1: "yes"         # Algorand Testnet note txn + Bitcoin OP_RETURN checkpoints
    forensics: "yes"  # the deployed layer probes, imported and applied across clients
    rollback: "no"    # NOT implemented. The lineage identifies a bad round; nothing undoes it.
